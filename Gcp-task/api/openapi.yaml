
swagger: "2.0"

info:
  title: task-gke-api
  description: API Gateway for the GKE application
  version: "1.0.0"

schemes:
  - https

produces:
  - text/html

paths:
  /health:
    get:
      summary: Check application health
      operationId: getHealth
      x-google-backend:
        address: ${backend_url}
        path_translation: APPEND_PATH_TO_ADDRESS
        disable_auth: true
      responses:
        "200":
          description: Application responded successfully
          schema:
            type: string
